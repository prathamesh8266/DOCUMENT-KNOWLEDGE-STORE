service:
  type: NodePort

  ports:
    # Internal health/status port used by Istio.
    # Port 15021 is only used inside the cluster for Istio gateway health checks.
    - name: status-port
      port: 15021
      targetPort: 15021
      protocol: TCP

    # Matches kind containerPort 30080.
    # Accessible from the host through localhost:8080.
    - name: http2
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP

    # Matches kind containerPort 30443.
    # Accessible from the host through localhost:8443.
    - name: https
      port: 443
      targetPort: 443
      nodePort: 30443
      protocol: TCP