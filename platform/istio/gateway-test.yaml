apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-test
  template:
    metadata:
      labels:
        app: gateway-test
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-test
spec:
  selector:
    app: gateway-test
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: gateway-test
spec:
  hosts:
  # "*" does not mean localhost.

  # It means:
  # Accept any hostname, as long as the request reaches this Istio Gateway.
  # These could all match:
  # localhost:8080/test
  # rag.local:8080/test
  # hello.com:8080/test
  # 127.0.0.1:8080/test

  # But DNS or the hosts file must first direct the hostname to your machine.
  # DNS/hosts file → Gets request to the gateway
  # hosts: "*"     → Allows any hostname at the gateway
  # To restrict the test route to only a local domain, change it to:
  # hosts:
  #   - rag.local

    - "*"
  gateways:
    - rag-gateway
  http:
    - match:
        - uri:
            prefix: /test
      rewrite:
        uri: /
      route:
        - destination:
            host: gateway-test
            port:
              number: 80