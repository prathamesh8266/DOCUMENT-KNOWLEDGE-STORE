global:
  seaweedfs:
    enableReplication: false

master:
  replicas: 1
  data:
    type: persistentVolumeClaim
    storageClass: standard
    size: 1Gi

volume:
  replicas: 1
  dataDirs:
    - name: documents
      type: persistentVolumeClaim
      storageClass: standard
      size: 10Gi
      maxVolumes: 0

filer:
  replicas: 1
  data:
    type: persistentVolumeClaim
    storageClass: standard
    size: 2Gi

s3:
  enabled: true
  replicas: 1
  enableAuth: true

  # Credentials will be provided separately and not committed to Git.
  existingConfigSecret: seaweedfs-s3-config

  createBuckets:
    - name: documents
      anonymousRead: false